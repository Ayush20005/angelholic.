
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Romantic Surprise</title>

  <!-- Cute Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      font-family:'Poppins', sans-serif;
      background: linear-gradient(135deg,#ffd1dc,#ffe4ec,#fff0f5);
      position:relative;
    }

    /* Floating Hearts */
    .heart{
      position:absolute;
      color:#ff4d88;
      font-size:20px;
      animation: float 6s linear infinite;
      opacity:0.7;
    }

    @keyframes float{
      0%{
        transform:translateY(100vh) scale(0);
      }
      100%{
        transform:translateY(-10vh) scale(1);
      }
    }

    /* Main Card */
    .container{
      text-align:center;
      position:relative;
      z-index:10;
    }

    .title{
      font-size:3rem;
      color:#ff2e63;
      margin-bottom:20px;
      font-family:'Dancing Script', cursive;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:0 0 10px #ff99b9;
      }
      to{
        text-shadow:0 0 20px #ff2e63;
      }
    }

    /* Envelope */
    .envelope-wrapper{
      position:relative;
      width:320px;
      height:220px;
      cursor:pointer;
      margin:auto;
      transition:transform 0.4s ease;
    }

    .envelope-wrapper:hover{
      transform:scale(1.05);
    }

    .envelope{
      position:absolute;
      width:100%;
      height:100%;
      background:#ff5c8a;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    /* Top Flap */
    .flap{
      position:absolute;
      top:0;
      width:100%;
      height:100%;
      background:#ff7aa2;
      clip-path:polygon(0 0,100% 0,50% 55%);
      transform-origin:top;
      transition:transform 1s ease;
      z-index:5;
    }

    /* Letter */
    .letter{
      position:absolute;
      width:90%;
      height:85%;
      background:white;
      left:5%;
      top:10%;
      border-radius:10px;
      padding:20px;
      text-align:center;
      transform:translateY(100%);
      transition:transform 1s ease;
      z-index:2;
      overflow:auto;
    }

    .letter h2{
      color:#ff2e63;
      margin-bottom:15px;
      font-family:'Dancing Script', cursive;
      font-size:2rem;
    }

    .letter p{
      color:#555;
      line-height:1.6;
      font-size:1rem;
    }

    /* Open Animation */
    .open .flap{
      transform:rotateX(180deg);
    }

    .open .letter{
      transform:translateY(-10%);
    }

    /* Button */
    .btn{
      margin-top:25px;
      padding:12px 28px;
      border:none;
      border-radius:30px;
      background:#ff2e63;
      color:white;
      font-size:1rem;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(255,46,99,0.3);
    }

    .btn:hover{
      background:#ff4f81;
      transform:translateY(-2px);
    }

    /* Music Note */
    .music-note{
      position:absolute;
      top:20px;
      right:20px;
      font-size:30px;
      color:#ff2e63;
      animation:bounce 2s infinite;
    }

    @keyframes bounce{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-8px);
      }
    }

    @media(max-width:450px){
      .envelope-wrapper{
        width:280px;
        height:200px;
      }

      .title{
        font-size:2.3rem;
      }
    }

  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <script>
    for(let i=0;i<25;i++){
      let heart=document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML="❤";
      heart.style.left=Math.random()*100+"vw";
      heart.style.animationDuration=(Math.random()*3+3)+"s";
      heart.style.fontSize=(Math.random()*20+15)+"px";
      document.body.appendChild(heart);
    }
  </script>

  <!-- Music -->
  <audio autoplay loop>
    <source src="Piche Tere Kunwarr (pagalall.com).mp3" >
  </audio>

  <div class="music-note">🎵</div>

  <div class="container">

    <h1 class="title">For Someone Special ❤️</h1>

    <div class="envelope-wrapper" onclick="redirectToPage()">

      <div class="envelope">

        <div class="flap"></div>

        <div class="letter">
          <h2>Hey Angel 💌</h2>

          <p>
            You make every moment beautiful.<br><br>

            Every smile of yours feels magical,
            every conversation feels special,
            and every memory with you becomes unforgettable. ❤️
            <br><br>

            This little surprise is just to remind you
            how valuable you are.
            <br><br>

            Forever your admirer ✨
          </p>

        </div>

      </div>

    </div>

    <button class="btn" onclick="redirectToPage()">
      Open Surprise 💖
    </button>

  </div>

  <script>
    function redirectToPage(){
      window.location.href = '2.html'; // Replace with your actual second page URL
    }

    function openLetter(){
      document.querySelector(".envelope-wrapper")
      .classList.toggle("open");
    }
  </script>
  

</body>
</html>
